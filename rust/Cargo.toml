[package]
name = "xgrep-search"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "Ultra-fast indexed code search engine with MCP server for AI coding tools."
license = "MIT"
readme = "README.md"
repository = "https://github.com/momokun7/xgrep"
keywords = ["search", "grep", "trigram", "index", "code-search"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["fuzz/"]
autobenches = false

[[bin]]
name = "xg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
memchr = "2"
ignore = "0.4"
anyhow = "1"
thiserror = "2"
dirs-next = "2"
rayon = "1"
libc = "0.2"
regex = "1"
regex-syntax = "0.8"
tempfile = "3"
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
notify = "8"
# Syntax-aware features (outline, tags-based definitions, block expansion,
# references, repo map). Optional so `--no-default-features` builds stay
# C-compiler free and small.
tree-sitter = { version = "0.25", optional = true }
streaming-iterator = { version = "0.1", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }

[features]
default = ["syntax"]
syntax = [
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-python",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-go",
    "dep:tree-sitter-java",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-ruby",
]
fuzz = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "bench_search"
harness = false

[[bench]]
name = "bench_index"
harness = false

[[bench]]
name = "bench_candidates"
harness = false

[[bench]]
name = "search_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
