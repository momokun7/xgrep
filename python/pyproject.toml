[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xgrep-search"
description = "Ultra-fast indexed code search engine with MCP server for AI coding tools."
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version", "readme"]

[tool.maturin]
python-source = "."
module-name = "xg._xg"
# The `xg` CLI is shipped through the wheel's `scripts` install scheme, which
# pip places on PATH (venv `bin/`, or `Scripts\` on Windows). maturin only
# packages the cdylib of a pyo3 project and ignores bin targets, so the CLI is
# built from the `rust/` crate and staged as `wheel-data/scripts/xg[.exe]`
# before `maturin build` (see the build-python job in release.yml).
data = "wheel-data"
features = ["extension-module"]
