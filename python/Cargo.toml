[package]
name = "xgrep-pyo3"
version = "0.6.0"
edition = "2021"
publish = false

[lib]
name = "_xg"
crate-type = ["cdylib"]

[[bin]]
name = "xg"
path = "src/main.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
# Without the tree-sitter `syntax` feature: keeps cross builds C-compiler free.
xgrep-search = { path = "../rust", default-features = false }
pyo3 = "0.29"
mimalloc = { version = "0.1", default-features = false }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
