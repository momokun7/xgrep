name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build
      - name: Test
        working-directory: rust
        run: cargo test --no-fail-fast
      - name: Test without the syntax feature (as shipped in npm/pip)
        if: matrix.os == 'ubuntu-latest'
        working-directory: rust
        run: cargo test --no-default-features
      - name: Build release
        working-directory: rust
        run: cargo build --release
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        working-directory: rust
        run: |
          ./target/release/xg --help | grep -q "Ultra-fast indexed code search"
          ./target/release/xg "fn main" --type rs | grep -q "fn main"
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: rust
        shell: pwsh
        run: |
          .\target\release\xg.exe --help
          .\target\release\xg.exe "fn main" --type rs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (no default features)
        working-directory: rust
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Format check
        working-directory: rust
        run: cargo fmt -- --check

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Cargo audit
        working-directory: rust
        run: cargo audit
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: rust
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Check for unsafe code count
        working-directory: rust
        run: |
          UNSAFE_COUNT=$(grep -rn "unsafe" src/ --include="*.rs" | grep -v "SAFETY" | grep -v "#\[cfg" | grep -v "test" | grep -v "mod tests" | wc -l | tr -d ' ')
          echo "Unsafe blocks (excluding tests and SAFETY-commented): $UNSAFE_COUNT"
          if [ "$UNSAFE_COUNT" -gt 25 ]; then
            echo "WARNING: High number of unsafe blocks ($UNSAFE_COUNT). Review needed."
            exit 1
          fi

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Generate coverage
        working-directory: rust
        run: cargo tarpaulin --out xml --output-dir coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5
        with:
          files: rust/coverage/cobertura.xml
          fail_ci_if_error: false

  msrv:
    name: MSRV check (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Check MSRV
        working-directory: rust
        run: cargo check

  npm-bindings:
    name: npm bindings
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: npm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Format
        working-directory: npm
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: npm
        run: cargo clippy -- -D warnings
      - name: Install dependencies
        working-directory: npm
        run: npm ci
      - name: Build native module
        working-directory: npm
        run: npx napi build --platform
      # napi build rewrites index.d.ts from the doc comments in src/lib.rs, and
      # the README's API section is generated from index.d.ts.
      - name: Check index.d.ts and the README API section are up to date
        run: |
          git diff --exit-code -- npm/index.d.ts
          python3 scripts/npm_readme.py --check
      - name: Test
        working-directory: npm
        run: node __test__/index.mjs

  python-bindings:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            python
            rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 3.11 (last) builds the wheel; the others check the abi3 wheel
          # works on the oldest and newest supported interpreters.
          python-version: |
            3.8
            3.13
            3.11
      - name: Format
        working-directory: python
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: python
        run: cargo clippy -- -D warnings
      - name: Install maturin
        run: pip install --require-hashes -r python/requirements-build.txt
      # Mirrors the release build-python job (debug profile to stay fast):
      # the wheel must ship the `xg` CLI in its `scripts` scheme.
      - name: Build xg CLI
        working-directory: rust
        run: cargo build --bin xg
      - name: Build wheel
        run: |
          mkdir -p python/wheel-data/scripts
          cp rust/target/debug/xg python/wheel-data/scripts/
          cd python
          maturin build --features extension-module -i python3.11
      - name: Install wheel and run xg
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install python/target/wheels/*.whl
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          test "$(command -v xg)" = "$RUNNER_TEMP/wheel-venv/bin/xg"
          xg --version
          xg -c "fn run_cli" rust/src
          python -c "import xg; print(xg.Xgrep, xg.SearchResult, xg.IndexStatus)"
      - name: Install the abi3 wheel on other Python versions
        run: |
          for v in 3.8 3.13; do
            "python$v" -m venv "$RUNNER_TEMP/venv-$v"
            "$RUNNER_TEMP/venv-$v/bin/python" -m pip install python/target/wheels/*.whl
            "$RUNNER_TEMP/venv-$v/bin/python" -c "import xg; assert xg.Xgrep.open('rust/src').search('fn run_cli')"
          done

  python-wheel:
    name: Python wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: |
            python
            rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install --require-hashes -r python/requirements-build.txt
      # Same packaging as the release build-python job, on the platforms the
      # Linux "Python bindings" job cannot cover (xg.exe, Scripts/ layout).
      - name: Build xg CLI
        working-directory: rust
        run: cargo build --bin xg
      - name: Build wheel
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          mkdir -p python/wheel-data/scripts
          cp "rust/target/debug/xg$exe" python/wheel-data/scripts/
          cd python
          maturin build --features extension-module -i python
      - name: Install wheel and run xg
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: |
          python -m venv .wheel-venv
          bin=".wheel-venv/bin"; [ "$RUNNER_OS" = "Windows" ] && bin=".wheel-venv/Scripts"
          "$bin/python" -m pip install python/target/wheels/*.whl
          "$bin/xg" --version
          "$bin/xg" -c "fn run_cli" rust/src
          "$bin/python" -c "import xg; print(xg.Xgrep, xg.SearchResult, xg.IndexStatus)"

  cross-aarch64:
    name: Cross build (aarch64-linux)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # Mirrors the release workflow so C (tree-sitter) cross builds break here, not at release time.
      - name: Build
        working-directory: rust
        run: cargo build --release --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

  release:
    name: Release build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, lint, security, msrv]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: xg-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: xg-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        if: matrix.os == 'ubuntu-latest'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Build release
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: rust/target/${{ matrix.target }}/release/xg
