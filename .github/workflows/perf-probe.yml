# TEMPORARY - delete this file before merging into main
name: Perf Probe (temporary)

on:
  workflow_dispatch:

jobs:
  perf-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Build xg
        working-directory: rust
        run: cargo build --release

      - name: Clone Linux kernel (shallow)
        run: git clone --depth 1 https://github.com/torvalds/linux.git /tmp/linux

      - name: Build index
        run: |
          cd /tmp/linux
          $GITHUB_WORKSPACE/rust/target/release/xg init

      - name: "Probe: focused (CONFIG_PREEMPT_RT, ~300 hits)"
        run: |
          cd /tmp/linux
          XGREP_PERF_TIMING=1 $GITHUB_WORKSPACE/rust/target/release/xg "CONFIG_PREEMPT_RT" >/dev/null

      - name: "Probe: medium (struct file_operations, ~2600 hits)"
        run: |
          cd /tmp/linux
          XGREP_PERF_TIMING=1 $GITHUB_WORKSPACE/rust/target/release/xg "struct file_operations" >/dev/null

      - name: "Probe: distributed (devm_kzalloc, ~7400 hits)"
        run: |
          cd /tmp/linux
          XGREP_PERF_TIMING=1 $GITHUB_WORKSPACE/rust/target/release/xg "devm_kzalloc" >/dev/null

      - name: "Probe: very distributed (EXPORT_SYMBOL_GPL, ~21000 hits)"
        run: |
          cd /tmp/linux
          XGREP_PERF_TIMING=1 $GITHUB_WORKSPACE/rust/target/release/xg "EXPORT_SYMBOL_GPL" >/dev/null
