name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.2)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - id: version
        name: Extract and verify version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          CARGO_VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EXPECTED="v${CARGO_VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED" ]; then
            echo "ERROR: Tag '$RELEASE_TAG' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists, skipping creation"
          else
            gh release create "$RELEASE_TAG" --draft --generate-notes
          fi

  build-release:
    name: Build (${{ matrix.target }})
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: xg-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: xg-aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: xg-aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: xg-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: xg-x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: rust
      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build release
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd rust/target/${{ matrix.target }}/release
          tar czf ${{ matrix.artifact }}.tar.gz xg
          mv ${{ matrix.artifact }}.tar.gz ../../../../
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd rust/target/${{ matrix.target }}/release
          Compress-Archive -Path xg.exe -DestinationPath ${{ matrix.artifact }}.zip
          Move-Item ${{ matrix.artifact }}.zip ../../../../
      - name: Upload to release (unix)
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
        run: gh release upload "$RELEASE_TAG" "${ARTIFACT}.tar.gz" --clobber
      - name: Upload to release (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          ARTIFACT: ${{ matrix.artifact }}
        run: gh release upload "$env:RELEASE_TAG" "$env:ARTIFACT.zip" --clobber

  publish-crate:
    name: Publish to crates.io
    needs: [create-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - name: Publish (idempotent)
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if cargo search xgrep-search --limit 1 2>/dev/null | grep -q "\"$CARGO_VERSION\""; then
            echo "::warning::xgrep-search $CARGO_VERSION already published on crates.io — skipping. If the tag was moved to a new commit, bump the version (e.g. v${CARGO_VERSION%.*}.$((${CARGO_VERSION##*.} + 1))) instead of re-tagging."
          else
            cargo publish --allow-dirty
          fi

  build-npm:
    name: Build npm (${{ matrix.target }})
    needs: [create-release]
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0.4.0
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: npm
        run: npm ci
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build native module
        working-directory: npm
        run: npx napi build --release --platform --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || contains(matrix.os, 'macos') && matrix.target == 'aarch64-apple-darwin'
        working-directory: npm
        run: node __test__/index.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.target }}
          path: npm/xgrep.*.node
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: [create-release, build-npm]
    if: always() && needs.create-release.result == 'success' && needs.build-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (OIDC)
        run: npm install -g npm@latest
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: npm/artifacts
      - name: Move binaries
        working-directory: npm
        run: |
          for dir in artifacts/bindings-*/; do
            cp "$dir"/*.node . 2>/dev/null || true
          done
          ls -la *.node
      - name: Sync version from Cargo.toml
        working-directory: npm
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - name: Install dependencies
        working-directory: npm
        run: npm ci
      - name: Publish (idempotent, OIDC trusted publishing)
        working-directory: npm
        run: |
          RELEASE_VERSION="${{ needs.create-release.outputs.version }}"
          if npm view xgrep@"$RELEASE_VERSION" version 2>/dev/null | grep -q "$RELEASE_VERSION"; then
            echo "::warning::xgrep@$RELEASE_VERSION already published on npm — skipping. If the tag was moved to a new commit, bump the version instead of re-tagging."
          else
            npm publish --access public
          fi

  build-python:
    name: Build Python wheel (${{ matrix.target }})
    needs: [create-release]
    if: always() && needs.create-release.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin==1.8.3"
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build wheel
        working-directory: python
        run: maturin build --release --target ${{ matrix.target }} --features extension-module
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheels-${{ matrix.target }}
          path: python/target/wheels/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [create-release, build-python]
    if: always() && needs.create-release.result == 'success' && needs.build-python.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/xgrep-search/
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # setup-python v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin==1.8.3"
      - name: Download all Python wheels
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: python-wheels-*
          path: python/dist
          merge-multiple: true
      - name: List wheels
        run: ls -la python/dist/
      - name: Publish (idempotent, OIDC Trusted Publishing)
        working-directory: python
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          if pip index versions xgrep-search 2>/dev/null | grep -q "($RELEASE_VERSION)"; then
            echo "::warning::xgrep-search $RELEASE_VERSION already published on PyPI — skipping."
          else
            maturin upload --skip-existing dist/*.whl
          fi

  publish-release:
    name: Publish Release
    needs: [create-release, build-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release as non-draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "${{ github.repository }}"
