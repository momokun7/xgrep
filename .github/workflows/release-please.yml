name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and create the GitHub release
      pull-requests: write # label the merged release PR
      actions: write # dispatch release.yml (GITHUB_TOKEN may trigger workflow_dispatch)
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release PRs are opened by the maintainer (see CONTRIBUTING.md):
          # a PR opened with GITHUB_TOKEN never triggers CI, so it could not
          # pass the required checks. Merging that PR still creates the
          # GitHub release and starts release.yml here.
          skip-github-pull-request: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Trigger release workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --field "tag=$TAG_NAME"
