name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI, so required checks
          # never run on the release PR. RELEASE_PLEASE_TOKEN (a fine-grained
          # PAT or GitHub App token with contents + pull-requests write on
          # this repo) fixes that; without it, close and reopen the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Trigger release workflow
        if: steps.release.outputs['rust--release_created'] == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs['rust--tag_name'] }}
        run: gh workflow run release.yml --repo "${{ github.repository }}" --field "tag=$TAG_NAME"
